[project]
name = "myshop"
version = "0.1.0"
description = "用来演示测试金字塔四层的迷你商店"
requires-python = ">=3.9"
dependencies = []            # 主代码只用标准库,不装任何第三方包
# 没有 [project.optional-dependencies]:教程第 2 页、本项目 README
# 与 CI 三处装工具用的都是 `pip install pytest mypy ruff`,
# 没有一处用 `-e ".[dev]"` —— 留着它只会让读者去跑
# 一条全书没教过的命令。2026-09-03 删。

# ---------------- pytest:跑测试 ----------------
[tool.pytest.ini_options]
testpaths = ["tests"]        # 只去 tests/ 里找测试,别扫整个项目
pythonpath = ["."]           # ← 救命稻草:让 `import myshop` 能找到包
addopts = "-v --strict-markers"   # -v = 每条测试单独打一行,初学者看得更清楚
# 第 18 页第二节:给核心用例分级。--strict-markers 要求每个标记先在这里登记
markers = [
    "p0: 核心链路,挂了就是生产事故",
]
# 只有名字符合这些规则的东西才会被当成测试
python_files = ["test_*.py"]
python_functions = ["test_*"]

# ---------------- mypy:静态类型检查 ----------------
[tool.mypy]
python_version = "3.9"
files = ["myshop", "tests"]
strict = true                # 一步到位开严格模式
# 没有 check_untyped_defs:`--strict` 启用的清单里就有它,写两遍是冗余;
# 而且“防 AI 漏写 -> None”靠的是 disallow_untyped_defs,不是它 ——
# 这两件事教程第 2 页第五节与第 4 页都写明了。2026-09-03 删。

[[tool.mypy.overrides]]
module = "playwright.*"      # playwright 没装,别因为找不到它就报错
ignore_missing_imports = true

# ---------------- ruff:格式 + 语法检查(比 flake8 快很多)----------------
[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
# E=代码风格 F=真正的错误(未使用变量等) I=import 排序 B=常见 bug 陷阱
# 常见说法是「Python 3.9 上不要加 UP」—— 教程第 2 页第八节实测过,
# 那个因果关系是错的:只要上面 target-version 写对了,加 UP 是安全的
# (ruff 不会建议你用 3.10+ 的语法)。这里没加只是为了保持规则集最小。
select = ["E", "F", "I", "B"]

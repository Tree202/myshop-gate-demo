# ============================================================
# 质量门禁(Quality Gate)
#
# 这个文件放在 .github/workflows/ 下面,GitHub 会自动发现它。
# 它跑在 GitHub 的服务器上,不是你的电脑上 —— 这是它绕不过去的原因。
#
# 触发时机:每次 push,以及每次开 Pull Request
# 判定规则:任何一个 step 的命令返回非 0,这个 job 就算失败
# ============================================================

name: 质量门禁

on:
  push:
    branches: [main]
  pull_request:            # 开 PR 时也跑 —— 这是门禁真正起作用的地方

# 下面三段是「加了没代价」的三件套。教程第 18 页第九节列了这份配置
# 刻意没包含什么、以及为什么;这三段不在那张表里,因为它们不需要权衡:
#
#   permissions  —— 默认给的令牌权限偏大。这个流水线只需要读代码,
#                   就明确写成只读。万一某个 action 被投毒,它能干的事就少得多。
#   concurrency  —— 同一个 PR 连推三次,默认会排三条流水线,前两条白跑。
#                   设了它,新的一推,旧的自动取消。
#   timeout      —— 卡住的任务默认能跑到 6 小时。测试三秒跑完的项目,
#                   十分钟还没结束一定是出事了,早点掐掉。
permissions:
  contents: read           # 只读代码,不给写权限

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true # 同一分支的新提交,把上一条还在跑的取消掉

jobs:
  gate:
    name: 三道检查
    runs-on: ubuntu-latest       # GitHub 提供的一台干净的 Linux 机器
    timeout-minutes: 10          # 正常 20 秒跑完,十分钟还没完就是卡住了

    steps:
      # ---- 准备:把代码拉下来 ----
      - name: 拉取代码
        uses: actions/checkout@v7

      # ---- 准备:装 Python ----
      - name: 装 Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # ---- 准备:装三个工具 ----
      # 注意这里没有虚拟环境:CI 的机器本来就是一次性的,
      # 跑完就销毁,不存在"污染系统环境"的问题,所以直接装。
      - name: 装检查工具
        run: pip install pytest mypy ruff

      # ============ 门禁 1:代码规范(最快,先跑)============
      - name: 门禁 1 · ruff 代码规范
        run: ruff check .

      # ============ 门禁 2:类型检查 ============
      - name: 门禁 2 · mypy 类型检查
        run: mypy

      # ============ 门禁 3:测试(最慢,放最后)============
      - name: 门禁 3 · pytest 全部测试
        run: pytest -q
